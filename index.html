<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Diagnóstico Trinia</title>
<style>
:root{--navy:#1B2A4A;--petroleo:#0F5C63;--magenta:#B0246B;--bg:#FAFAF8;--bot:#F1F1F4;--line:#D9DBE3;--muted:#6b6f80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--navy);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
header strong{display:block;font-size:15px}
header span{font-size:12px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.linha{display:flex;gap:8px;align-items:flex-end}
.linha.eu{justify-content:flex-end}
.bolha{max-width:80%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;background:var(--bot);word-wrap:break-word}
.linha.eu .bolha{background:var(--petroleo);color:#fff;border-bottom-right-radius:4px}
.linha.bot .bolha{border-bottom-left-radius:4px}
.digitando{font-size:13px;color:var(--muted);padding-left:40px}
#opcoes{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;padding-left:56px}
.chip{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip:hover,.chip:focus{background:var(--navy);color:#fff;outline:none}
.agenda{display:inline-block;background:var(--magenta);color:#fff;text-decoration:none;border-radius:10px;padding:12px 18px;font-size:15px}
.agendaWrap{padding-left:40px}
#entrada{border-top:1px solid var(--line);background:#fff;padding:12px 16px}
#entrada form{display:flex;gap:8px}
#campo{flex:1;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
#entrada button.enviar{background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:0 18px;font-size:15px;cursor:pointer;font-family:inherit}
.consent{display:flex;gap:8px;font-size:13px;color:#4a4e5e;margin:10px 0 0;align-items:flex-start}
.consent input{margin-top:3px}
.erro{color:var(--magenta);font-size:13px;margin-top:6px;min-height:16px}
.oculto{display:none !important}
</style>
</head>
<body>

<header>
  <div class="avatar">T</div>
  <div>
    <strong>Trinia</strong>
    <span>Diagnóstico rápido · 2 minutos</span>
  </div>
</header>

<main id="chat" aria-live="polite"></main>
<div id="opcoes"></div>

<div id="entrada" class="oculto">
  <form id="form" autocomplete="off">
    <input id="campo" type="text">
    <button class="enviar" type="submit">Enviar</button>
  </form>
  <label class="consent oculto" id="consentLinha">
    <input type="checkbox" id="consent">
    <span>Aceito receber a conversa no WhatsApp sobre este diagnóstico. Posso sair a qualquer momento respondendo SAIR.</span>
  </label>
  <div class="erro" id="erro"></div>
</div>

<script src="roteiro.js"></script>
<script>
(function () {
  const chat = document.getElementById('chat');
  const opcoesEl = document.getElementById('opcoes');
  const entrada = document.getElementById('entrada');
  const form = document.getElementById('form');
  const campo = document.getElementById('campo');
  const consentLinha = document.getElementById('consentLinha');
  const consent = document.getElementById('consent');
  const erro = document.getElementById('erro');

  // Gatilho e lead vêm da URL do link do LinkedIn, ex.: ?g=pergunta-crescimento&l=lead-012
  const params = new URLSearchParams(location.search);
  const dados = { gatilho: params.get('g') || '', lead: params.get('l') || '' };

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const preenche = (t) => t.replace(/\{(\w+)\}/g, (_, k) => (dados[k] != null ? dados[k] : ''));
  const rolar = () => { chat.scrollTop = chat.scrollHeight; };

  function bolha(texto, quem) {
    const linha = document.createElement('div');
    linha.className = 'linha ' + quem;
    if (quem === 'bot') {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = 'T';
      linha.appendChild(av);
    }
    const b = document.createElement('div');
    b.className = 'bolha';
    b.textContent = texto;
    linha.appendChild(b);
    chat.appendChild(linha);
    rolar();
  }

  async function falaBot(textos) {
    for (const t of textos || []) {
      const d = document.createElement('div');
      d.className = 'digitando';
      d.textContent = '…';
      chat.appendChild(d);
      rolar();
      await sleep(Math.min(1400, 700 + t.length * 12));
      d.remove();
      bolha(preenche(t), 'bot');
    }
  }

  function mostraOpcoes(lista, aoEscolher) {
    opcoesEl.innerHTML = '';
    lista.forEach((op) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = op.label;
      b.onclick = () => {
        opcoesEl.innerHTML = '';
        aoEscolher(op);
      };
      opcoesEl.appendChild(b);
    });
  }

  function abreEntrada(tipo, placeholder) {
    campo.type = tipo === 'tel' ? 'tel' : 'text';
    campo.inputMode = tipo === 'tel' ? 'tel' : 'text';
    campo.placeholder = placeholder || (tipo === 'tel' ? '(11) 99999-9999' : '');
    entrada.classList.remove('oculto');
    campo.value = '';
    erro.textContent = '';
    campo.focus();
  }

  function pedeEntrada(validar, aoConfirmar) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const v = campo.value.trim();
      const msg = validar(v);
      if (msg) {
        erro.textContent = msg;
        return;
      }
      entrada.classList.add('oculto');
      bolha(v, 'eu');
      await aoConfirmar(v);
    };
  }

  // Envio das respostas ao HubSpot (formulário público, sem chave secreta).
  async function enviaHubSpot() {
    const { portalId, formGuid } = CONFIG.hubspot;
    if (!portalId || portalId.startsWith('COLE') || !formGuid || formGuid.startsWith('COLE')) {
      console.warn('HubSpot ainda não configurado em roteiro.js. Nada foi enviado.');
      return false;
    }
    const campos = Object.keys(MAPA_CAMPOS)
      .map((chave) => ({ name: MAPA_CAMPOS[chave], value: String(dados[chave] != null ? dados[chave] : '') }))
      .filter((c) => c.value !== '');
    const corpo = {
      fields: campos,
      context: { pageUri: location.href, pageName: 'Diagnóstico Trinia' }
    };
    try {
      const r = await fetch(
        'https://api.hsforms.com/submissions/v3/integration/submit/' + portalId + '/' + formGuid,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) }
      );
      return r.ok;
    } catch (e) {
      console.error('Falha ao enviar ao HubSpot', e);
      return false;
    }
  }

  async function executa(id) {
    const passo = ROTEIRO.passos[id];
    if (!passo) return;
    await falaBot(passo.msgs);

    if (passo.tipo === 'botoes') {
      mostraOpcoes(passo.opcoes, async (op) => {
        bolha(op.label, 'eu');
        if (passo.campo) dados[passo.campo] = op.label;
        await executa(op.next);
      });
    }

    else if (passo.tipo === 'texto') {
      abreEntrada('text', passo.placeholder);
      const minimo = passo.minimo || 2;
      pedeEntrada(
        (v) => (v.length < minimo ? (passo.erro || 'Preencha este campo.') : ''),
        async (v) => {
          dados[passo.campo] = v;
          await executa(passo.next);
        }
      );
    }

    else if (passo.tipo === 'whatsapp') {
      abreEntrada('tel');
      consentLinha.classList.remove('oculto');
      consent.checked = false;
      pedeEntrada(
        (v) => {
          const d = v.replace(/\D/g, '');
          if (d.length < 10 || d.length > 13) return 'Confira o número com DDD.';
          if (!consent.checked) return 'Marque a caixa de consentimento para continuar.';
          return '';
        },
        async (v) => {
          dados[passo.campo] = v.replace(/\D/g, '');
          dados.consentimento = 'sim';
          consentLinha.classList.add('oculto');
          await enviaHubSpot();
          await executa(passo.next);
        }
      );
    }

    else if (passo.tipo === 'agenda') {
      const wrap = document.createElement('div');
      wrap.className = 'linha bot agendaWrap';
      const a = document.createElement('a');
      a.className = 'agenda';
      a.textContent = 'Escolher horário';
      if (CONFIG.calendarUrl && !CONFIG.calendarUrl.startsWith('COLE')) {
        a.href = CONFIG.calendarUrl;
        a.target = '_blank';
        a.rel = 'noopener';
      } else {
        a.href = '#';
        a.title = 'Configure o link da agenda em roteiro.js';
      }
      wrap.appendChild(a);
      chat.appendChild(wrap);
      rolar();
    }
  }

  executa(ROTEIRO.inicio);
})();
</script>
</body>
</html>
